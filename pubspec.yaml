#   ignore_comments: true
#   field_prefix: null
#   classname: AppAnimations
#!=======================ICONS========================
flutter_assets:
  assets_path: assets/icons
  output_path: lib/core/theme
  filename: app_icons.dart
  ignore_comments: true
  field_prefix: null
  classname: AppIcons
